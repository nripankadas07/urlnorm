[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "urlnorm"
version = "0.1.0"
description = "Zero-dep URL normalizer — case-fold, default-port strip, dot-segment removal, percent-encoding canonicalization, optional query sort."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nripanka Das" }]
requires-python = ">=3.10"
keywords = ["url", "uri", "normalize", "canonical", "rfc3986", "parser", "zero-dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nripankadas07/urlnorm"
Source   = "https://github.com/nripankadas07/urlnorm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urlnorm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["urlnorm"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
